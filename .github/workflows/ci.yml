name: TaskFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: taskflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/taskflow_ci?schema=public
      NODE_ENV: test
      JWT_SECRET: ci-test-jwt-secret-min-32-chars-for-taskflow

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify code formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Verify Prisma schema formatting
        run: npm run prisma:format:check

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Test apply Prisma migrations
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma

      - name: Build packages and apps
        run: npm run build

      - name: Type check all workspaces
        run: npm run type-check
