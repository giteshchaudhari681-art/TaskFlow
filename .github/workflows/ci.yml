name: TaskFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: taskflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/taskflow_ci?schema=public
      NODE_ENV: test
      JWT_SECRET: ci-test-jwt-secret-min-32-chars-for-taskflow
      COOKIE_SECRET: ci-test-cookie-secret-min-32-chars-taskflow

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify code formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Verify Prisma schema formatting
        run: npm run prisma:format:check

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Test apply Prisma migrations
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma

      - name: Build packages and apps
        run: npm run build

      - name: Type check all workspaces
        run: npm run type-check

      - name: Run automated test suite
        run: npm run test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E test suite
        run: npm run test:e2e
        env:
          CI: 'true'
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/taskflow_ci?schema=public
          JWT_SECRET: ci-test-jwt-secret-min-32-chars-for-taskflow
          COOKIE_SECRET: ci-test-cookie-secret-min-32-chars-taskflow
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:5000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
